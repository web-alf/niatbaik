services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=niatbaik
      - DB_PASSWORD=secret
      - DB_NAME=niatbaik
      - JWT_SECRET=dev-jwt-secret-change-in-prod
      - CORS_ORIGINS=http://localhost:3000
      - UPLOAD_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads
    networks:
      - niatbaik
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - niatbaik
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: niatbaik
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: niatbaik
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - niatbaik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niatbaik"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - niatbaik
    restart: unless-stopped

volumes:
  postgres-data:
  api-uploads:

networks:
  niatbaik:
    driver: bridge
