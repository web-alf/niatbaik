limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=donate_limit:10m rate=10r/m;

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_proxied any;

upstream api {
    server api:8080;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # NOTE: the tracking domains below must stay whitelisted or GTM / GA4 / Google Ads /
    # Meta Pixel / TikTok are silently blocked (scripts inject but never load/beacon) —
    # this was the "Event GTM keblokir padahal sudah terhubung" symptom. tracking.jsx
    # injects gtm.js + fbevents + ttq at runtime; the conversion beacons go to
    # googleads.g.doubleclick.net / google-analytics.com, so they need connect-src too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://analytics.tiktok.com https://*.tiktok.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.niatbaik.org https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://*.g.doubleclick.net https://connect.facebook.net https://*.facebook.com https://analytics.tiktok.com https://*.tiktok.com https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self' https://www.googletagmanager.com https://td.doubleclick.net https://*.facebook.com" always;

    # Login rate limit (5 req/min per IP)
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Donation rate limit (10 req/min per IP)
    location = /api/donations {
        limit_req zone=donate_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → Go (rate limited)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhooks → Go (no rate limit, long timeout)
    location /api/webhooks/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Uploads → Go. ^~ makes this prefix WIN over the later
    # `~* \.(css|png|jpg|...)$` regex location — without it, /uploads/x.png would be
    # routed to the frontend (regex locations outrank plain prefix locations),
    # returning the SPA HTML instead of the actual image.
    # NOTE: do NOT set expires/Cache-Control here — the API already sends a single
    # `Cache-Control: public, max-age=31536000, immutable`. Adding another here
    # produced TWO conflicting Cache-Control headers, which broke CDN/browser caching
    # and made images reload from origin every time (slow). Just proxy through.
    location ^~ /uploads/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # index.html — never cache so new asset hashes are always picked up
    location = / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else → Bun frontend (SPA fallback handled by the Bun server)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets cache (1 year). Vite content-hashes /assets/*.{js,css} filenames,
    # so they're safe to cache immutably. `js` MUST be included — Vite emits hashed JS
    # bundles (was app.min.js, now /assets/index-<hash>.js).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|map)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location = /health {
        proxy_pass http://api/api/health;
        access_log off;
    }
}
