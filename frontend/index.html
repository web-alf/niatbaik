  .field{width:100%;border-radius:.5rem;border:1px solid #E2E8F0;background:#fff;padding:.5rem .75rem;font-size:.875rem;color:#1E293B;outline:none}
  .field::placeholder{color:#64748B}
  .field:focus{box-shadow:0 0 0 2px rgba(46,65,145,.2);border-color:#2E4191}

  .density-compact .pad-y{padding-top:.5rem;padding-bottom:.5rem}
  .density-compact .pad-x{padding-left:.75rem;padding-right:.75rem}
  .density-compact .gap-row{gap:.5rem}

  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .shimmer{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.4) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2.2s infinite}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fadeup{animation:fadeup .35s ease both}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

  @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  @keyframes float-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .cta-shadow{box-shadow:0 -10px 30px rgba(15,23,42,.06)}
  .tnum{font-variant-numeric:tabular-nums}
  .dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:6px;background:currentColor;vertical-align:middle}
