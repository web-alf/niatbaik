<!doctype html>
<!-- Manual browser self-check for compressImage (needs canvas + WebP encoder).
     Open via the Vite dev server: http://localhost:3000/scripts/compress-image.test.html
     Expect every row: type=image/webp, size ≤ 102400. -->
<meta charset="utf-8"><title>compressImage check</title>
<pre id="out">running…</pre>
<script type="module">
import { compressImage } from '/src/lib/api.ts';
const out = document.getElementById('out');
const log = (s) => (out.textContent += s + '\n');
out.textContent = '';

// Noisy 3000x2000 PNG — worst case for compression.
const c = document.createElement('canvas'); c.width = 3000; c.height = 2000;
const ctx = c.getContext('2d'); const d = ctx.createImageData(3000, 2000);
for (let i = 0; i < d.data.length; i++) d.data[i] = Math.random() * 255;
ctx.putImageData(d, 0, 0);
const noisyPng = new File([await new Promise((r) => c.toBlob(r, 'image/png'))], 'noise.png', { type: 'image/png' });

// SVG without intrinsic size (icon).
const svg = new File(['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2E4191"/></svg>'], 'icon.svg', { type: 'image/svg+xml' });

// Tiny GIF (1x1).
const gif = new File([Uint8Array.from(atob('R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=='), (ch) => ch.charCodeAt(0))], 'dot.gif', { type: 'image/gif' });

let fail = 0;
for (const f of [noisyPng, svg, gif]) {
  const o = await compressImage(f);
  const ok = o.type === 'image/webp' && o.size <= 102400 && o.name.endsWith('.webp');
  if (!ok) fail++;
  log(`${ok ? 'PASS' : 'FAIL'} ${f.name} (${f.size} B) → ${o.name} ${o.type} ${o.size} B`);
}
log(fail ? `\n${fail} FAILED` : '\nALL PASS');
</script>
